name: Keep Render awake
on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render (wake free tier)
        run: |
          curl -sS -o /dev/null -w "render:%{http_code}\n" --max-time 90 \
            "https://public-meeting-forum.onrender.com/" || true
          curl -sS -o /dev/null -w "vercel_proxy:%{http_code}\n" --max-time 90 \
            "https://public-meeting-forum.vercel.app/api/auth/me" || true
